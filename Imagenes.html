<!DOCTYPE html>
<html lang="en"> <!-- Define la estructura del documento en idioma inglés -->

<head>
    <!-- Configuración para el soporte de caracteres globales y acentos (UTF-8) -->
    <meta charset="UTF-8">
    <!-- Ajusta la escala para que la página sea adaptable a móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Imagenes en HTML</title>
</head>

<body>
    <h2>Imagenes en HTML</h2>

    <!-- Imagen local: 'caritas.png' se encuentra en la misma carpeta que el archivo HTML -->
    <!-- 'alt' brinda una descripción de la imagen si esta no logra cargar -->
    <h3>Locales</h3>
    <img src="caritas.png" alt="Imagen de carita feliz">

    <!-- Imagen local relativa: busca dentro de la subcarpeta 'imagenes' -->
    <!-- 'width' y 'height' fuerzan las dimensiones fijas de la imagen en píxeles -->
    <h3>Locales redismensionado</h3>
    <img src="imagenes/carita.png" alt="" width="200" height="100">

    <!-- Imagen remota: se obtiene directamente desde un servidor web externo mediante su enlace URL -->
    <h3>Desde internet</h3>
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt="">

    <!-- Imagen en formato .gif: la etiqueta <img> también sirve para cargar recursos animados -->
    <h3>Animaciones</h3>
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="">
</body>

</html>
